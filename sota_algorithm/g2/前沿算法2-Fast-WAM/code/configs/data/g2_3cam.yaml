train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/lerobot/g2_pick_block_lerobot
  shape_meta:
    images:
      - key: cam_head
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: cam_left_wrist
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: cam_right_wrist
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 16 # before transform
        shape: 16 # after transform
    state:
      - key: default
        raw_shape: 16 # before transform
        shape: 16 # after transform
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [384, 320] # final resize video
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin" # 头 + 左右腕三视图，与官方 RoboTwin 一致
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 16
    proprio_output_dim: 16

    # action & state normalization（G2 使用绝对关节目标，与 RoboTwin 配置一致）
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/g2
  context_len: 128

val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/lerobot/g2_pick_block_lerobot
  shape_meta: ${data.train.shape_meta}
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [384, 320]
  camera_key: null
  val_set_proportion: 0.01
  is_training_set: false
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 16
    proprio_output_dim: 16
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/g2
  context_len: 128
