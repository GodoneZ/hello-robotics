bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "" # launch 注入本章安装目录中的 config/navigate_to_pose.xml。
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    - dock_goal_checker
    controller_plugins:
    - FollowPath
    - Dock
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    # 粗导航进入低速精靠范围；最终伸臂门槛仍为 6cm / 0.05rad。
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false # 到达时同时检查 XY/yaw，不保留曾进入 XY 容差的状态。
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
    # 精靠内部容差与 DWB RotateToGoal 一致；最终任务仍独立复核 6 cm / 0.05 rad。
    dock_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 0.02
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.05
      debug_trajectory_details: false
      min_vel_x: -0.55
      min_vel_y: -0.55
      max_vel_x: 0.55
      max_vel_y: 0.55
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.55
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.8
      acc_lim_theta: 1.8
      decel_lim_x: -0.8
      decel_lim_y: -0.8
      decel_lim_theta: -1.8
      vx_samples: 13
      vy_samples: 13
      vtheta_samples: 41
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.04
      transform_tolerance: 0.25
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Twirling
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      Twirling.scale: 1.0 # 全向平移期间抑制无意义自转。
      BaseObstacle.scale: 0.005 # 保留致命碰撞拒绝；避免膨胀梯度压过桌旁目标距离项。
      PathAlign.scale: 0.0 # 全向底盘不强制朝向路径切线，避免桌边局部极小值。
      PathAlign.forward_point_distance: 0.25
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.25
      PathDist.scale: 20.0
      GoalDist.scale: 32.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.5 # 终点短视窗，避免粗角速度采样的零速死区。
    # 同一套 DWB 的低速配置。展开写，避免 ROS 参数解析器不支持 YAML alias。
    # 仅用于桌旁 <=30 cm 的 odom 短路径，不替代全局规划。
    Dock:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.05
      debug_trajectory_details: false
      min_vel_x: -0.12
      min_vel_y: -0.12
      max_vel_x: 0.12
      max_vel_y: 0.12
      max_vel_theta: 0.25
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.8
      acc_lim_theta: 1.8
      decel_lim_x: -0.8
      decel_lim_y: -0.8
      decel_lim_theta: -1.8
      # 低速动态窗口减少候选数量，避免沿用全速配置造成控制周期超时。
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 21
      sim_time: 1.5
      linear_granularity: 0.02
      angular_granularity: 0.02
      transform_tolerance: 0.25
      xy_goal_tolerance: 0.025
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Twirling
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      Twirling.scale: 1.0 # 全向平移期间抑制无意义自转。
      BaseObstacle.scale: 0.005 # 保留致命碰撞拒绝；避免膨胀梯度压过桌旁目标距离项。
      PathAlign.scale: 0.0 # 全向底盘不强制朝向路径切线，避免桌边局部极小值。
      PathAlign.forward_point_distance: 0.25
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.25
      PathDist.scale: 20.0
      GoalDist.scale: 32.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.5 # 终点短视窗，避免粗角速度采样的零速死区。
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      # 局部 2 cm 栅格匹配 2.5 cm 精靠容差；全局地图仍保持 5 cm。
      resolution: 0.02
      robot_radius: 0.4
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.12
          obstacle_max_range: 7.5
          raytrace_min_range: 0.12
          raytrace_max_range: 8.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.48
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.4
      track_unknown_space: false
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.12
          obstacle_max_range: 7.5
          raytrace_min_range: 0.12
          raytrace_max_range: 8.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.48
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      use_astar: true
      allow_unknown: false
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.8
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 1000
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.55
    - 0.55
    - 1.0
    min_velocity:
    - -0.55
    - -0.55
    - -1.0
    max_accel:
    - 0.8
    - 0.8
    - 1.8
    max_decel:
    - -0.8
    - -0.8
    - -1.8
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: scan
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: -3.6
      y: -3.3
      z: 0.0
      yaw: 0.0
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    laser_max_range: 8.0
    laser_min_range: 0.12
    update_min_d: 0.1
    update_min_a: 0.1
    transform_tolerance: 1.0
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
