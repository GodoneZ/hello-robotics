# 唯一场景/任务配置。坐标米、角度弧度，房间与第十章相同。
start: [-3.6, -3.3, 0.0]
dock: [2.52, 2.6, 0.0]
# 源桌停靠点；与当前桌面布局和机械臂工作范围配套。
source_dock: [-3.66, -3.20, 0.0]
# 仅 Isaac 仿真：抓取、抬升及持物回 home 临时忽略 MoveIt 碰撞。
# 不关闭 Isaac 物理碰撞、Nav2 避障、关节限位和静止互锁。真实设备必须为 false。
simulation_grasp_ignore_collisions: true
# 桌面/板子格式：[中心 x, y, z, 长, 宽, 厚]。
table: [3.40, 2.34, 0.848, 0.92, 1.08, 0.08]
tray: [3.00, 2.18, 0.892, 0.22, 0.20, 0.008]
source_table: [-2.72, -3.56, 0.848, 0.92, 1.08, 0.08]
# 出生布局只供仿真；在线感知不使用物体位置。
# 两张桌子使用相同布局：从机器人靠近的 X 侧边缘向内 1/4 桌宽，
# 三个物体沿 Y 方向横向均匀排列，避免堆叠，方便相机观察和机械臂抓取。
# 桌宽 0.92 m，X 偏移 -0.23 m = 从左侧边缘向内 1/4 桌宽。
items:
  - {name: apple, offset: [-0.23, 0.00]}
  - {name: orange, offset: [-0.23, -0.14]}
  - {name: tea_box, offset: [-0.23, 0.14]}
place_slots: [[3.00, 2.13], [3.00, 2.23]]
# 感知使用模型类别 apple，不使用红色阈值兜底。
vision: {confidence: 0.40}

obstacles:
  - [0.0, 0.0, 0.35, 1.0, 2.4, 0.70]
  - [-2.2, 1.9, 0.35, 0.9, 1.4, 0.70]
  - [2.1, -1.8, 0.35, 1.3, 0.8, 0.70]
home: [-0.739033, -0.717023, 1.524419, -1.537612, -0.278110, -0.925845, 0.839257]
left_home: [0.739033, -0.717023, -1.524419, -1.537612, 0.278110, -0.925845, -0.839257]
nav_timeout: 240.0
motion_timeout: 90.0

# 携物导航保持 home 姿态和夹爪闭合目标，低速行走；独立检查夹持关节未闭空/张开。
carry_gripper_range: [0.08, 0.60]
